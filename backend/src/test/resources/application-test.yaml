spring:
  datasource:
    url: jdbc:h2:mem:premium_essai_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

application:
  security:
    jwt:
      secret-key: test-secret-key-for-service-unit-tests
      expiration-hours: 1
